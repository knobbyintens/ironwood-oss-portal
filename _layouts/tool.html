<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ page.title }} · Ironwood Developer Portal</title>
</head>
<body>
  <h1>{{ page.title }}</h1>
  <p>{{ page.tagline }}</p>
  <p>Status: {{ page.status }}</p>
  <p><a href="{{ page.docsurl }}">Documentation</a></p>
  {% if page.codeurl %}<p><a href="{{ page.codeurl }}">Source code</a></p>{% endif %}
  {{ content }}
</body>
</html>
